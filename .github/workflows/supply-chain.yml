name: supply-chain
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ssca (pinned release, checksum verified)
        run: |
          curl -sSfL -o ssca "$SSCA_URL"
          echo "$SSCA_SHA256  ssca" | sha256sum -c -
          chmod +x ssca && sudo mv ssca /usr/local/bin/ssca
        env:
          SSCA_URL: ${{ vars.SSCA_RELEASE_URL }}
          SSCA_SHA256: ${{ vars.SSCA_RELEASE_SHA256 }}
      - name: Audit CI configuration (M5)
        run: ssca ci-audit .
      # The runner is a fresh machine, so the data snapshot of ssca (registry
      # metadata, advisories, POMs) is kept between runs; ssca itself refreshes
      # every entry older than 24 hours.
      - name: Restore ssca data snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ssca
          key: ssca-snapshot-${{ github.run_id }}
          restore-keys: ssca-snapshot-
      - name: Supply-chain audit and policy gate (M0-M6)
        run: ssca scan --policy .ssca/policy.yaml --out ssca-out .
      - name: Save ssca data snapshot
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ssca
          key: ssca-snapshot-${{ github.run_id }}
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ssca-out/findings.sarif
      - name: Keep evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssca-evidence
          path: ssca-out/
  build:
    needs: audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write          # keyless signing with Sigstore
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm pack --ignore-scripts
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: acme-orders-api-*.tgz
      - run: cp "${{ steps.attest.outputs.bundle-path }}" acme-orders-api.tgz.sigstore.json && mv acme-orders-api-*.tgz acme-orders-api.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            acme-orders-api.tgz
            acme-orders-api.tgz.sigstore.json
  release-gate:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Install ssca
        run: |
          curl -sSfL -o ssca "$SSCA_URL" && echo "$SSCA_SHA256  ssca" | sha256sum -c - && chmod +x ssca
        env:
          SSCA_URL: ${{ vars.SSCA_RELEASE_URL }}
          SSCA_SHA256: ${{ vars.SSCA_RELEASE_SHA256 }}
      - name: Verify signature and provenance of the release artifact (M3)
        run: ./ssca verify-artifact --repo "$GITHUB_REPOSITORY" acme-orders-api.tgz
